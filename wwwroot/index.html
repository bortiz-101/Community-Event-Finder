<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Community Events</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Cluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        #map {
            flex: 1;
        }

        #right {
            width: 420px;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            padding: 10px;
            font-size: 13px;
            border-bottom: 1px solid #ddd;
        }

        #list {
            overflow: auto;
            flex: 1;
            min-height: 200px;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

            .item:hover {
                background: #f0f8ff;
            }

            .item.selected {
                background: #cde8ff;
                border-left: 4px solid #0078d7;
            }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .title {
            font-weight: 700;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 290px;
        }

        .meta {
            margin-top: 4px;
            color: #666;
            font-size: 12px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .star {
            cursor: pointer;
            font-size: 18px;
            color: #bbb;
        }

            .star.on {
                color: #f1c40f;
            }

        .trash {
            cursor: pointer;
            font-size: 16px;
            opacity: .65;
        }

            .trash:hover {
                opacity: 1;
            }

        textarea {
            width: 100%;
            height: 220px;
            border: none;
            border-top: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
        }

        input, select, button {
            margin: 4px 0;
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        .searchWrap {
            position: relative;
        }

        #searchBox {
            padding-right: 28px;
            height: 30px;
        }

        .clearBtn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-weight: 700;
        }

            .clearBtn:hover {
                color: #000;
            }

        .checkRow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            margin-bottom: 4px;
            font-weight: 700;
        }

            .checkRow input {
                width: auto;
                margin: 0;
            }

        .inlineRow {
            display: flex;
            gap: 6px;
        }

            .inlineRow input {
                flex: 1;
            }

            .inlineRow button {
                width: 90px;
            }

        .toolbarBtn {
            width: 100%;
            margin-top: 6px;
            background: #0078d7;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
        }

        .toolbarBtn:hover:not(:disabled) {
            background: #005a9e;
        }

        .toolbarBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        button[onclick="syncExternalEvents()"] {
            background: #27ae60;
        }

        button[onclick="syncExternalEvents()"]:hover:not(:disabled) {
            background: #229954;
        }

        .auth-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            font-size: 12px;
            z-index: 1000;
        }

        .auth-bar a, .auth-bar button {
            padding: 8px 12px !important;
            width: auto !important;
            margin: 0 !important;
            background: #0078d7;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .auth-bar a:hover, .auth-bar button:hover {
            background: #005a9e;
        }

        .auth-bar .logout {
            background: #dc3545;
        }

        .auth-bar .logout:hover {
            background: #c82333;
        }

        .user-info {
            background: #f0f0f0;
            color: #333;
            padding: 8px 12px;
            border-radius: 4px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="auth-bar" id="authBar">
        <a href="login.html">🔐 Login</a>
        <a href="register.html">✍️ Register</a>
    </div>

    <div id="map"></div>

    <div id="right">
        <div id="toolbar">

            <!-- SEARCH -->
            <div class="searchWrap">
                <input id="searchBox" placeholder="Search..." oninput="onSearch(this.value)">
                <span class="clearBtn" onclick="clearSearch()">×</span>
            </div>

            <!-- RADIUS -->
            <select onchange="setRadius(this.value)" style="height:30px">
                <option>All distances</option>
                <option>5 mi</option>
                <option>10 mi</option>
                <option>20 mi</option>
            </select>

            <!-- MONTH FILTER -->
            <label style="display: block; margin: 6px 0 2px 0; font-weight: 700; font-size: 13px;">Month (optional)</label>
            <div class="inlineRow">
                <input id="monthInput" type="month" onchange="setMonth(this.value)">
                <button onclick="clearMonth()" style="width: 85px;">Clear</button>
            </div>

            <!-- SOURCE FILTER -->
            <label style="display: block; margin: 6px 0 2px 0; font-weight: 700; font-size: 13px;">Source (optional)</label>
            <select id="sourceSelect" onchange="setSource(this.value)" style="height:30px">
                <option value="">All sources</option>
            </select>

            <!-- FAVORITES ONLY -->
            <div class="checkRow">
                <input type="checkbox" onchange="setFavoritesOnly(this.checked)">
                <span>Only Starred</span>
            </div>

            <!-- DEFAULT ADDRESS -->
            <div class="checkRow">
                <input type="checkbox" id="defaultCheck" checked onchange="toggleDefaultCenter()">
                <span>Use default address</span>
            </div>

            <!-- ADDRESS + APPLY SAME ROW -->
            <div class="inlineRow">
                <input id="centerBox" value="1032 W Sheridan Rd, Chicago, IL" disabled>
                <button onclick="setCenterFromAddress(centerBox.value)">Apply</button>
            </div>

            <hr>

            <!-- BUTTONS -->
            <button class="toolbarBtn" onclick="showAll()">Show All Events</button>

            <button class="toolbarBtn" onclick="syncExternalEvents()" id="syncBtn" style="background: #27ae60;">⟳ Sync Data</button>

            <button class="toolbarBtn" onclick="openAddWindow()">＋ Add Event</button>

            <button class="toolbarBtn" onclick="openCalendarWindow()">📅 Calendar</button>

            <button class="toolbarBtn" onclick="window.open('/api/events/ics')">
                ⭐ Export Starred events (ICS)
            </button>

        </div>

        <div id="list"></div>

<textarea id="detail" readonly>Select an event…</textarea>

    </div>

    <script src="app.js"></script>

    <script>
        // Check user authentication status
        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/auth/profile', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const user = await response.json();
                    updateAuthBar(user);
                } else {
                    // Not authenticated
                    showAuthButtons();
                }
            } catch (error) {
                console.log('Authentication check failed:', error);
                showAuthButtons();
            }
        }

        function updateAuthBar(user) {
            const authBar = document.getElementById('authBar');
            const isAdmin = user.roles && user.roles.includes('Admin');
            
            authBar.innerHTML = `
                <div class="user-info">👤 ${user.userName}</div>
                ${isAdmin ? '<button class="admin-btn" title="Admin">⚙️ Admin</button>' : ''}
                <button class="logout" onclick="logout()">🚪 Logout</button>
            `;
        }

        function showAuthButtons() {
            const authBar = document.getElementById('authBar');
            authBar.innerHTML = `
                <a href="login.html">🔐 Login</a>
                <a href="register.html">✍️ Register</a>
            `;
        }

        async function logout() {
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });

                if (response.ok) {
                    alert('Logged out successfully!');
                    location.href = 'start.html';
                }
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        }

        // Check auth status on page load
        document.addEventListener('DOMContentLoaded', checkAuthStatus);
    </script>

</body>
</html>
